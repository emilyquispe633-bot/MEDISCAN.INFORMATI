<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Proyecto educativo para estudiantes sobre automedicación y uso responsable de medicamentos en Juliaca.">
  <meta name="theme-color" content="#14324b">
  <title>MEDISCAM | Uso responsable de medicamentos</title>

  <style>
    :root {
      --navy: #14324b;
      --blue: #176b87;
      --teal: #39a99b;
      --paper: #f4f7f8;
      --white: #fff;
      --ink: #20313d;
      --muted: #62727d;
      --line: #dce5e9;
      --warning: #fff4dc;
      --warning-ink: #744f00;
      --shadow: 0 12px 32px rgba(20, 50, 75, .1);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    .wrap { width: min(1120px, calc(100% - 32px)); margin-inline: auto; }

    .notice {
      padding: 11px 16px;
      background: var(--warning);
      color: var(--warning-ink);
      text-align: center;
      font-size: .9rem;
      font-weight: 750;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--navy);
      font-size: 1.3rem;
      font-weight: 900;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      font-size: 1.5rem;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 17px;
    }

    .nav-links a {
      color: var(--muted);
      font-size: .9rem;
      font-weight: 750;
      text-decoration: none;
    }

    .nav-links a:hover { color: var(--blue); }

    /* Portada con fotografía */
    .hero {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 500px;
      overflow: hidden;
      color: white;
      background: var(--navy);
    }

    .hero-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 38%;
      opacity: .46;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(10,35,52,.96) 0%, rgba(15,62,81,.83) 48%, rgba(15,62,81,.30) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 760px;
      padding: 64px 0;
    }

    .eyebrow {
      display: inline-block;
      padding: 5px 11px;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 999px;
      color: #d9fffa;
      font-size: .76rem;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 12px;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      line-height: 1.08;
    }

    .hero-content > p {
      max-width: 650px;
      color: #edf7f8;
      font-size: clamp(1rem, 2vw, 1.15rem);
    }

    .hero-note {
      max-width: 680px;
      margin-top: 24px;
      padding: 14px 17px;
      border-left: 4px solid #6de0c9;
      border-radius: 8px;
      background: rgba(255,255,255,.13);
      backdrop-filter: blur(5px);
    }

    .hero-button {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 18px;
      border-radius: 11px;
      color: var(--navy);
      background: white;
      font-weight: 850;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }

    .hero-button:hover { transform: translateY(-2px); background: #e7f6f3; }

    main { padding: 38px 0 64px; }

    .search-panel, .info-panel {
      padding: clamp(20px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    h2 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: clamp(1.55rem, 3vw, 2rem);
      line-height: 1.2;
    }

    .subtext { margin: 0; color: var(--muted); }

    .search-row { display: flex; gap: 12px; margin-top: 22px; }

    input[type="search"] {
      width: 100%;
      min-width: 0;
      padding: 13px 15px;
      border: 2px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: white;
    }

    input[type="search"]:focus {
      outline: 3px solid #bce7e1;
      border-color: var(--teal);
    }

    .clear-button, .chip {
      border: 0;
      border-radius: 10px;
      font-weight: 750;
    }

    .clear-button {
      flex: 0 0 auto;
      padding: 0 18px;
      color: white;
      background: var(--blue);
    }

    .clear-button:hover { background: var(--navy); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 16px;
    }

    .chip {
      padding: 8px 12px;
      border: 1px solid var(--line);
      color: var(--navy);
      background: #f8fbfc;
      font-size: .88rem;
    }

    .chip:hover, .chip.active {
      border-color: var(--blue);
      color: white;
      background: var(--blue);
    }

    .results-section { margin-top: 36px; }

    .result-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 30px 0 16px;
    }

    #resultCount { color: var(--muted); font-size: .9rem; }

    .catalog-note {
      margin: 0 0 17px;
      padding: 12px 15px;
      border-left: 4px solid var(--teal);
      border-radius: 8px;
      background: #eaf6f4;
      color: #284f50;
      font-size: .9rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 260px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      box-shadow: 0 5px 18px rgba(20,50,75,.045);
      animation: appear .32s ease both;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }

    @keyframes appear {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tag {
      align-self: flex-start;
      padding: 4px 9px;
      border-radius: 999px;
      background: #e8f4f4;
      color: #176b70;
      font-size: .72rem;
      font-weight: 850;
      text-transform: uppercase;
    }

    .card h3 {
      margin: 12px 0 6px;
      color: var(--navy);
      font-size: 1.12rem;
      line-height: 1.35;
    }

    .card p { margin: 0 0 12px; color: var(--muted); font-size: .91rem; }

    .card .caution {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: #735300;
      font-size: .84rem;
    }

    .details-button {
      margin-top: 15px;
      padding: 11px 13px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: var(--blue);
      font-weight: 800;
      transition: background .2s ease;
    }

    .details-button:hover { background: var(--navy); }

    .empty {
      display: none;
      margin-top: 16px;
      padding: 28px;
      border: 1px dashed #b6c7ce;
      border-radius: 16px;
      background: white;
      color: var(--muted);
      text-align: center;
    }

    .section-block { padding: 46px 0 10px; }
    .section-intro { max-width: 760px; margin-bottom: 20px; }

    /* Fotonovela con fotografías */
    .story-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .story-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      box-shadow: var(--shadow);
      transition: transform .2s ease;
    }

    .story-card:hover { transform: translateY(-4px); }

    .story-image {
      display: block;
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #dce8ec;
    }

    .story-copy { padding: 18px; }

    .story-copy .scene {
      color: var(--blue);
      font-size: .75rem;
      font-weight: 850;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .story-copy h3 { margin: 5px 0 8px; color: var(--navy); }
    .story-copy p { margin: 0; color: var(--muted); font-size: .92rem; }

    .dialogue {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #edf7f6;
      color: var(--navy);
      font-size: .88rem;
      font-weight: 700;
    }

    .consequence-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    .consequence-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: white;
    }

    .consequence-card .symbol {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      margin-bottom: 8px;
